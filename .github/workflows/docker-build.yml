name: Docker Build and Push

on:
  # 添加手动触发，防止构建卡住反复删除 tag
  workflow_dispatch:
  push:
    tags:
      - v*

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.get_version.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Get version from tag
        id: get_version
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Build Docker image for Next.js app
        uses: docker/build-push-action@v4
        timeout-minutes: 10
        with:
          context: .
          push: false
          load: true
          tags: musedam-website:local

      - name: Build Docker image for Jobs
        uses: docker/build-push-action@v4
        timeout-minutes: 10
        with:
          context: .
          file: ./Dockerfile.job
          push: false
          load: true
          tags: musedam-website-job:local

      - name: Save Docker images
        run: docker save musedam-website:local musedam-website-job:local | gzip > /tmp/images.tar.gz

      - name: Upload Docker images artifact
        uses: actions/upload-artifact@v4
        with:
          name: docker-images
          path: /tmp/images.tar.gz
          retention-days: 1

  push-azure:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - name: Download Docker images
        uses: actions/download-artifact@v4
        with:
          name: docker-images
          path: /tmp

      - name: Load Docker images
        run: gunzip -c /tmp/images.tar.gz | docker load

      - name: Inspect image sizes and registry connectivity
        run: |
          for image in musedam-website:local musedam-website-job:local; do
            echo "::group::Image diagnostics: $image"
            docker image inspect "$image" --format 'Total uncompressed bytes: {{.Size}}'
            echo 'Filesystem layer IDs (base to top; prefixes match docker push output):'
            docker image inspect "$image" --format '{{range .RootFS.Layers}}{{println .}}{{end}}'
            echo 'Layer history (top to base; includes metadata-only entries):'
            docker history "$image" --format 'table {{.ID}}\t{{.Size}}'
            echo 'Layer history sizes in bytes (same order):'
            docker history --no-trunc --human=false "$image" --format '{{.Size}}'
            echo '::endgroup::'
          done
          echo 'Unauthenticated registry probe: HTTP 401 is expected for a private registry.'
          curl --silent --show-error --output /dev/null --connect-timeout 10 --max-time 30 \
            --write-out 'HTTP %{http_code}; DNS %{time_namelookup}s; connect %{time_connect}s; TLS %{time_appconnect}s; first byte %{time_starttransfer}s; total %{time_total}s\n' \
            https://musecr.azurecr.cn/v2/ || echo '::warning::Registry connectivity probe failed; see curl error above.'

      - name: Login to Azure Container Registry
        uses: docker/login-action@v2
        with:
          registry: musecr.azurecr.cn
          username: ${{ secrets.AZURE_REGISTRY_USERNAME }}
          password: ${{ secrets.AZURE_REGISTRY_PASSWORD }}

      - name: Push Next.js app to Azure Container Registry
        run: |
          docker tag musedam-website:local musecr.azurecr.cn/muse/musedam-website:${{ env.VERSION }}
          docker tag musedam-website:local musecr.azurecr.cn/muse/musedam-website:latest
          date -u '+Upload started at %Y-%m-%dT%H:%M:%SZ'
          /usr/bin/time -p docker push musecr.azurecr.cn/muse/musedam-website:${{ env.VERSION }}
          /usr/bin/time -p docker push musecr.azurecr.cn/muse/musedam-website:latest

      - name: Push Jobs to Azure Container Registry
        run: |
          docker tag musedam-website-job:local musecr.azurecr.cn/muse/musedam-website:${{ env.VERSION }}-job
          docker tag musedam-website-job:local musecr.azurecr.cn/muse/musedam-website:latest-job
          date -u '+Upload started at %Y-%m-%dT%H:%M:%SZ'
          /usr/bin/time -p docker push musecr.azurecr.cn/muse/musedam-website:${{ env.VERSION }}-job
          /usr/bin/time -p docker push musecr.azurecr.cn/muse/musedam-website:latest-job

      - name: Setup Kubernetes Config And Update Deployment
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBE_CONFIG_MUSE_CLUSTER }}" > $HOME/.kube/config
          chmod 600 $HOME/.kube/config
          export KUBECONFIG=$HOME/.kube/config
          kubectl config use-context muse-aws-cn-prod
          kubectl set image deployment/musedam-website musedam-website=musecr.azurecr.cn/muse/musedam-website:${{ env.VERSION }} --namespace musedam
          kubectl config use-context muse-aws-us-prod
          kubectl set image deployment/musedam-website musedam-website=musecr.azurecr.cn/muse/musedam-website:${{ env.VERSION }} --namespace musedam

  push-ghcr:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      packages: write
    env:
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - name: Download Docker images
        uses: actions/download-artifact@v4
        with:
          name: docker-images
          path: /tmp

      - name: Load Docker images
        run: gunzip -c /tmp/images.tar.gz | docker load

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Next.js app to GitHub Container Registry
        run: |
          docker tag musedam-website:local ghcr.io/${{ github.repository_owner }}/musedam-website:${{ env.VERSION }}
          docker tag musedam-website:local ghcr.io/${{ github.repository_owner }}/musedam-website:latest
          docker push ghcr.io/${{ github.repository_owner }}/musedam-website:${{ env.VERSION }}
          docker push ghcr.io/${{ github.repository_owner }}/musedam-website:latest

      - name: Push Jobs to GitHub Container Registry
        run: |
          docker tag musedam-website-job:local ghcr.io/${{ github.repository_owner }}/musedam-website:${{ env.VERSION }}-job
          docker tag musedam-website-job:local ghcr.io/${{ github.repository_owner }}/musedam-website:latest-job
          docker push ghcr.io/${{ github.repository_owner }}/musedam-website:${{ env.VERSION }}-job
          docker push ghcr.io/${{ github.repository_owner }}/musedam-website:latest-job
